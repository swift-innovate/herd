[package]
name = "herd-tray"
version = "0.1.0"
edition = "2021"
authors = ["Swift Innovative Technologies"]
description = "Herd gateway tray icon — status viewer and launcher (Windows-first)"
license = "MIT"
repository = "https://github.com/swift-innovate/herd"

[[bin]]
name = "herd-tray"
path = "src/main.rs"

[dependencies]
tao = "0.30"
tray-icon = "0.19"
muda = "0.15"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
